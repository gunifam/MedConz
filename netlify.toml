# Netlify: auto-deploy from GitHub. Production = main branch,
# previews = every other branch/push.
# Packages compile first so the function bundle only ever sees plain JS.
# NOTE: publish is relative to the REPO ROOT (where this file lives), not
# to base. The function bundle expects the app at /var/task/apps/web.
[build]
  base = "apps/web"
  command = "npm run build --workspace=@medconz/db && npm run build --workspace=@medconz/ui && npm run build --workspace=@medconz/i18n && npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

# Required site env vars (Netlify dashboard → Site settings → Environment):
#   DATABASE_URL          pooled Neon URL, with ?sslmode=require
#   BETTER_AUTH_SECRET    32+ char secret (generate a NEW one, not the local one)
#   BETTER_AUTH_URL       https://<your-site>.netlify.app
#   NEXT_PUBLIC_APP_URL   https://<your-site>.netlify.app
#   TRUSTED_ORIGINS       https://<your-site>.netlify.app
# Optional (same meanings as local .env): ESPEES_NGN_RATE, CONSULT_PRICE_NGN,
# SUPPORTED_CRYPTOS, CRYPTO_QUOTE_TTL_MINUTES, FOLLOWUP_FREE_HOURS,
# FOLLOWUP_CHECKIN_HOURS, AVG_CONSULT_MINUTES, LONG_WAIT_MINUTES,
# READY_REMINDER_SECONDS, SNOOZE_MINUTES, INFO_REQUEST_TTL_MINUTES,
# TIMELINE_SHARE_DEFAULT_DAYS, R2_* (only when storage is wired)
